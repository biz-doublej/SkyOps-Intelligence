apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyops-dashboard
  namespace: skyops
  labels:
    app: skyops-dashboard
    component: ui
    version: "2.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skyops-dashboard
  template:
    metadata:
      labels:
        app: skyops-dashboard
        component: ui
        version: "2.1.0"
    spec:
      containers:
        - name: dashboard
          image: skyops/dashboard:2.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.skyops.example.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.skyops.example.com"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: skyops-dashboard
  namespace: skyops
spec:
  type: ClusterIP
  selector:
    app: skyops-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http

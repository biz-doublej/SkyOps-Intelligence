{{- if .Values.api.enabled }}
{{- if .Values.features.canaryRollout }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
    app: skyops-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: skyops-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.features.canaryRollout }}
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 5m }
        - setWeight: 25
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
        - setWeight: 100
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "skyops.labels" . | nindent 8 }}
        app: skyops-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      {{- if eq .Values.global.podSecurityEnforce "restricted" }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: api
          image: {{ include "skyops.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "{{ .Release.Name }}-api"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if eq .Values.global.podSecurityEnforce "restricted" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.healthcheck.initialDelaySec }}
            periodSeconds: {{ .Values.api.healthcheck.periodSec }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.healthcheck.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: cache
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: skyops-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

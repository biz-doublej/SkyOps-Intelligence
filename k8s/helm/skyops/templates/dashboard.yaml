{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
    app: skyops-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: skyops-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "skyops.labels" . | nindent 8 }}
        app: skyops-dashboard
    spec:
      {{- if eq .Values.global.podSecurityEnforce "restricted" }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "skyops.image" .Values.dashboard.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: "http://{{ .Release.Name }}-api:8000"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://{{ .Release.Name }}-api:8000"
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- if eq .Values.global.podSecurityEnforce "restricted" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  type: ClusterIP
  selector:
    app: skyops-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 3000
      targetPort: http
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyops-api
  namespace: skyops
  labels:
    app: skyops-api
    component: api
    version: "2.1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skyops-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: skyops-api
        component: api
        version: "2.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: skyops/api:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: skyops-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: models
              mountPath: /app/data/models
              readOnly: true
            - name: vectordb
              mountPath: /app/data/vectordb
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: skyops-models-pvc
        - name: vectordb
          persistentVolumeClaim:
            claimName: skyops-vectordb-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skyops-api-hpa
  namespace: skyops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skyops-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

# SkyOps Intelligence — Local k8s smoke test (P5+ · 2026-04-15)
# ============================================================================
# Docker Desktop Kubernetes 검증용 최소 manifests.
# Full stack은 k8s/ 디렉토리의 prod 매니페스트 사용 (Traefik CRD 필요).
#
# Deploy:
#   kubectl apply -f k8s/local/redis-only.yaml
#   kubectl get pods -n skyops-local
#   kubectl port-forward -n skyops-local svc/redis 6380:6379
#
# Cleanup:
#   kubectl delete -f k8s/local/redis-only.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: skyops-local
  labels:
    app: skyops
    env: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skyops-local-config
  namespace: skyops-local
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  OTEL_ENABLED: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: skyops-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
              name: tcp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: skyops-local
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: tcp
      port: 6379
      targetPort: tcp
---
# Smoke test pod — alpine + curl/redis-cli for end-to-end verification
apiVersion: v1
kind: Pod
metadata:
  name: smoke-test
  namespace: skyops-local
  labels:
    app: smoke-test
spec:
  containers:
    - name: shell
      image: redis:7.2-alpine
      command: ["sh", "-c", "echo '--- smoke test alive ---' && redis-cli -h redis ping && sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
  restartPolicy: Never

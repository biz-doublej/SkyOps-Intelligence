<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SkyOps H3 Heatmap</title>
  <script src="https://unpkg.com/kepler.gl@3.1.0/umd/keplergl.min.js"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/redux@4.2.1/dist/redux.min.js"></script>
  <script src="https://unpkg.com/react-redux@8.1.3/dist/react-redux.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    #app { position: absolute; width: 100%; height: 100%; }
    #fallback {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #94a3b8; z-index: 10;
    }
    #fallback.hidden { display: none; }
    #fallback h2 { color: #f1f5f9; margin-bottom: 8px; }
    #info-bar {
      position: absolute; top: 12px; right: 12px; z-index: 100;
      background: rgba(15,23,42,0.9); border: 1px solid #334155;
      border-radius: 8px; padding: 10px 16px; color: #f1f5f9; font-size: 13px;
    }
    #info-bar .count { font-size: 20px; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>
  <div id="fallback">
    <h2>H3 혼잡도 히트맵</h2>
    <p>데이터 로딩 중...</p>
    <p style="font-size:12px;margin-top:16px;color:#64748b">
      FastAPI 서버가 실행 중이어야 합니다 (localhost:8000)
    </p>
  </div>
  <div id="info-bar">
    <div>추적 항공기: <span class="count" id="aircraft-count">0</span>대</div>
    <div style="font-size:11px;color:#64748b;margin-top:4px">
      H3 Resolution 5 · <span id="hex-count">0</span>개 헥사곤
    </div>
  </div>
  <div id="app"></div>

  <script>
    const API_URL = new URLSearchParams(window.location.search).get('api') || 'http://localhost:8000';
    const MAPBOX_TOKEN = new URLSearchParams(window.location.search).get('token') || '';
    const REFRESH_INTERVAL = 5000;

    let map = null;
    let hexData = [];

    async function fetchH3Data() {
      try {
        const res = await fetch(`${API_URL}/aircraft/h3?resolution=5`);
        if (!res.ok) throw new Error(res.status);
        hexData = await res.json();
        return hexData;
      } catch (e) {
        console.warn('API fetch failed:', e);
        return [];
      }
    }

    function updateInfoBar(data) {
      const totalAircraft = data.reduce((s, d) => s + d.count, 0);
      document.getElementById('aircraft-count').textContent = totalAircraft;
      document.getElementById('hex-count').textContent = data.length;
    }

    function hexToPolygon(h3Index) {
      // h3-js is not loaded here, so we'll use a circle approximation
      // The actual hex boundary would need h3-js. Instead we use point + heatmap layer
      return null;
    }

    function toGeoJSON(data) {
      return {
        type: 'FeatureCollection',
        features: data.map(d => ({
          type: 'Feature',
          geometry: {
            type: 'Point',
            coordinates: [d.longitude, d.latitude]
          },
          properties: {
            hex_id: d.hex_id,
            count: d.count,
            avg_altitude: d.avg_altitude,
            avg_velocity: d.avg_velocity,
            callsigns: (d.callsigns || []).join(', ')
          }
        }))
      };
    }

    async function initMap() {
      const data = await fetchH3Data();
      if (data.length === 0) {
        // Keep fallback visible, retry
        setTimeout(initMap, 3000);
        return;
      }

      document.getElementById('fallback').classList.add('hidden');
      updateInfoBar(data);

      mapboxgl.accessToken = MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: 'app',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [127.5, 36.0],
        zoom: 6,
        pitch: 45,
      });

      map.on('load', () => {
        map.addSource('h3-data', {
          type: 'geojson',
          data: toGeoJSON(data)
        });

        // Heatmap layer
        map.addLayer({
          id: 'h3-heat',
          type: 'heatmap',
          source: 'h3-data',
          paint: {
            'heatmap-weight': ['interpolate', ['linear'], ['get', 'count'], 1, 1, 3, 2, 5, 3],
            'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 4, 2, 7, 4, 10, 6],
            'heatmap-color': [
              'interpolate', ['linear'], ['heatmap-density'],
              0, 'rgba(15,23,42,0)',
              0.05, '#1e3a5f',
              0.15, '#0ea5e9',
              0.3, '#38bdf8',
              0.5, '#22d3ee',
              0.7, '#fbbf24',
              0.85, '#ef4444',
              1, '#ff2222'
            ],
            'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 4, 60, 6, 80, 8, 100, 10, 120],
            'heatmap-opacity': 0.9,
          }
        });

        // Circle layer (visible at higher zoom)
        map.addLayer({
          id: 'h3-circles',
          type: 'circle',
          source: 'h3-data',
          minzoom: 7,
          paint: {
            'circle-radius': ['interpolate', ['linear'], ['get', 'count'], 1, 8, 5, 16, 10, 24],
            'circle-color': [
              'interpolate', ['linear'], ['get', 'count'],
              1, '#38bdf8', 3, '#fbbf24', 5, '#ef4444'
            ],
            'circle-opacity': 0.7,
            'circle-stroke-width': 1,
            'circle-stroke-color': '#0f172a',
          }
        });

        // 3D extrusion layer
        map.addLayer({
          id: 'h3-extrusion',
          type: 'fill-extrusion',
          source: 'h3-data',
          minzoom: 8,
          paint: {
            'fill-extrusion-color': [
              'interpolate', ['linear'], ['get', 'count'],
              1, '#38bdf8', 3, '#fbbf24', 5, '#ef4444'
            ],
            'fill-extrusion-height': ['*', ['get', 'count'], 5000],
            'fill-extrusion-opacity': 0.6,
          }
        }, 'h3-circles');

        // Popup
        const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });
        map.on('mouseenter', 'h3-circles', (e) => {
          map.getCanvas().style.cursor = 'pointer';
          const f = e.features[0];
          const p = f.properties;
          popup.setLngLat(f.geometry.coordinates)
            .setHTML(`
              <div style="color:#f1f5f9;font-size:13px">
                <div style="font-weight:bold;color:#38bdf8;margin-bottom:4px">
                  항공기 ${p.count}대
                </div>
                <div>평균 고도: ${Math.round(p.avg_altitude)}m</div>
                <div>평균 속도: ${Math.round(p.avg_velocity)}m/s</div>
                ${p.callsigns ? `<div style="color:#94a3b8;margin-top:4px;font-size:11px">${p.callsigns}</div>` : ''}
              </div>
            `)
            .addTo(map);
        });
        map.on('mouseleave', 'h3-circles', () => {
          map.getCanvas().style.cursor = '';
          popup.remove();
        });

        // Periodic data refresh
        setInterval(async () => {
          const newData = await fetchH3Data();
          if (newData.length > 0) {
            map.getSource('h3-data').setData(toGeoJSON(newData));
            updateInfoBar(newData);
          }
        }, REFRESH_INTERVAL);
      });
    }

    // Listen for parent postMessage (for dynamic API URL)
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_API_URL') {
        // Could reinitialize with new API URL
      }
    });

    initMap();
  </script>
</body>
</html>

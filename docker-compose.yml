version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: skyops-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: skyops-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: skyops-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: skyops-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ── P6-B · Confluent Schema Registry ────────────────────────────────
  # Activate:  docker compose --profile schema up -d schema-registry
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: skyops-schema-registry
    restart: unless-stopped
    profiles: [schema]
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: skyops-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo '>>> Kafka 토픽 생성 중...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic flight-position --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather-event --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic gate-event --partitions 3 --replication-factor 1
      # P4+ · 2026-04-15 · Canonical Event Model 확장
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic atfm-restriction --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notam --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alert-decision --partitions 3 --replication-factor 1
      echo '>>> 생성된 토픽 목록:'
      kafka-topics --bootstrap-server kafka:29092 --list
      echo '>>> 완료!'
      "

  # ------------------------------------------------------------------
  # Redis — 항공기별 최신 상태 캐시 (Sorted Set)
  # ------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: skyops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # v2.1.8 · Stage 1 Foundation — Iceberg REST catalog (Nessie) + object store (MinIO).
  # Profile `warehouse` 는 학습·실험 장비에서만 켠다 (laptop dev 는 sql+file).
  # docker compose --profile warehouse up -d
  # ------------------------------------------------------------------
  nessie:
    image: projectnessie/nessie:0.95.0
    container_name: skyops-nessie
    profiles: [warehouse]
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: "19120"
      NESSIE_VERSION_STORE_TYPE: "IN_MEMORY"
    ports:
      - "19120:19120"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:19120/api/v2/config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: skyops-minio
    profiles: [warehouse]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "skyops"
      MINIO_ROOT_PASSWORD: "skyops-dev-only"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: skyops-minio-init
    profiles: [warehouse]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 skyops skyops-dev-only &&
      (mc mb -p local/skyops-iceberg || true) &&
      mc anonymous set download local/skyops-iceberg &&
      echo 'bucket skyops-iceberg ready'
      "

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  minio-data:

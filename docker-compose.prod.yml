# SkyOps Intelligence — Production Docker Compose
# ADR-001 Phase 3 (P4+ · 2026-04-15)
#
# 실행:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f api
#   docker compose -f docker-compose.prod.yml down
#
# 전제:
#   - 학습된 모델이 ./data/models/ 에 존재 (xgboost_best.pkl, isolation_forest.pkl,
#     conformal_calibrator.pkl, quantile_*.pkl)
#   - ChromaDB가 ./data/vectordb/ 에 빌드됨
#   - ICAO 코퍼스가 ./data/icao/corpus/ 에 존재

networks:
  skyops:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
  zookeeper-data:
  prometheus-data:
  grafana-data:
  marquez-db-data:

services:
  # ── Infrastructure ─────────────────────────────────────────────────
  zookeeper:
    image: bitnami/zookeeper:3.8
    networks: [skyops]
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    ports: ["2181:2181"]

  kafka:
    image: bitnami/kafka:3.6
    networks: [skyops]
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    ports: ["9092:9092"]

  redis:
    image: redis:7.2-alpine
    networks: [skyops]
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── SkyOps API ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: skyops/api:2.1.0
    networks: [skyops]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VLLM_BASE_URL: "http://vllm:8001/v1"
      LLM_MODEL_ID: "aviation-llm"
      OTEL_ENABLED: "1"
      OTEL_SERVICE_NAME: "skyops-api"
      OTEL_CONSOLE_EXPORTER: "0"
      OTEL_OTLP_EXPORTER: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - ./data:/app/data:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ── Dashboard ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: skyops/dashboard:2.1.0
    networks: [skyops]
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000"
      NEXT_PUBLIC_WS_URL: "ws://api:8000"
    ports: ["3000:3000"]

  # ── vLLM (optional, GPU required) ─────────────────────────────────
  # Docker Compose profiles로 activate: docker compose --profile gpu up
  vllm:
    image: vllm/vllm-openai:latest
    networks: [skyops]
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model /models/qwen25_7b_awq
      --served-model-name aviation-llm
      --quantization awq_marlin
      --host 0.0.0.0 --port 8001
      --gpu-memory-utilization 0.82
      --max-model-len 2048
      --dtype float16 --trust-remote-code
    volumes:
      - ./data/models/llm:/models:ro
    ports: ["8001:8001"]

  # ── Traefik Gateway (ADR-002) ─────────────────────────────────────
  # 로컬에서 Traefik 실험 시 활성화
  traefik:
    image: traefik:v3.2
    networks: [skyops]
    profiles: [gateway]
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard

  # ── Jaeger (traces UI) ────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    networks: [skyops]
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC (legacy)
      # OTel collector가 4317로 받아서 포워드하므로 Jaeger는 내부 4317만

  # ── OTel Collector (optional) ─────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    networks: [skyops]
    profiles: [observability]
    depends_on: [jaeger]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC (host → collector)
      - "4318:4318"  # OTLP HTTP
      - "8889:8889"  # Prometheus metrics

  # ── Prometheus (P6-E · 2026-04-15) ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    networks: [skyops]
    profiles: [observability]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle    # allow `curl -X POST /-/reload`
    ports:
      - "9090:9090"

  # ── Grafana (P6-E · SLO/SLI dashboard) ────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    networks: [skyops]
    profiles: [observability]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: skyops
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"  # Grafana on host:3001 (dashboard 3000 충돌 회피)

  # ── Marquez (P7-B · OpenLineage backend) ──────────────────────────
  # Activate:  docker compose -f docker-compose.prod.yml --profile lineage up -d
  marquez-db:
    image: postgres:15-alpine
    networks: [skyops]
    profiles: [lineage]
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data

  marquez:
    image: marquezproject/marquez:0.50.0
    networks: [skyops]
    profiles: [lineage]
    depends_on: [marquez-db]
    environment:
      MARQUEZ_DB_HOST: marquez-db
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      MARQUEZ_DB_NAME: marquez
    ports:
      - "5000:5000"   # OpenLineage API
      - "5001:5001"   # admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5

# SkyOps Intelligence — OpenTelemetry Collector Config (P5+ · 2026-04-15)
# ============================================================================
# Receives OTLP from serving/api.py (Python OTel SDK)
# Exports to:
#   - Jaeger (traces)
#   - Prometheus (metrics scraping)
#   - stdout (debugging)
#
# Launch:
#   docker compose -f docker-compose.prod.yml --profile observability up -d
# Jaeger UI: http://localhost:16686

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: deployment.environment
        action: insert
      - key: service.namespace
        value: skyops
        action: upsert
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Jaeger via OTLP (Jaeger 1.35+ 은 OTLP native 수신)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Debug (stdout)
  debug:
    verbosity: basic

  # Prometheus (metrics)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: skyops

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

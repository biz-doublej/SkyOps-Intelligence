# SkyOps Intelligence — Prometheus scrape config (P6-E · 2026-04-15)
# ============================================================================
# Scrape targets:
#   - skyops-api: /metrics endpoint (FastAPI Prometheus instrumentator)
#   - otel-collector: :8889/metrics (OTel → Prometheus exporter, P5+)
#   - itself
#
# Activate:
#   docker compose -f docker-compose.prod.yml --profile observability up -d
#   # Prometheus UI: http://localhost:9090
#
# Recording / alerting rules: rules.yml (loaded below)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: skyops-local
    env: dev

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: skyops-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: skyops-api
          tier: serving

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
          tier: observability

# SkyOps Alertmanager config — v2.2.0 · ADR-007 D4b
# ============================================================================
# severity 레이블에 따라 라우트 분기:
#   critical → PagerDuty + Slack #skyops-incidents
#   warning  → Slack #skyops-alerts
#   info     → 주간 리뷰 이메일 (Slack 없음)
#
# **Secret은 Helm values 에서 `alertmanager.receivers.*` 로 주입.**
# 본 파일은 SMTP / Slack URL 자체를 담지 않음 — template 으로만 쓴다.

global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_API_URL}"   # helm value / env substitution

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: default
  group_by: ["alertname", "slo", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # ── CRITICAL: 즉시 page ──────────────────────────────────────────
    - matchers:
        - severity = "critical"
      receiver: pagerduty-ops
      continue: true  # 아래 Slack 채널에도 전달
    - matchers:
        - severity = "critical"
      receiver: slack-incidents

    # ── WARNING: ticket / Slack ──────────────────────────────────────
    - matchers:
        - severity = "warning"
      receiver: slack-alerts

    # ── INFO: 주간 리뷰 ──────────────────────────────────────────────
    - matchers:
        - severity = "info"
      receiver: email-weekly
      group_interval: 1h
      repeat_interval: 7d

inhibit_rules:
  # critical 이 active 면 같은 instance 의 warning 은 silent (noise 감소)
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "instance"]

receivers:
  - name: default
    # fallthrough for unmatched alerts — Slack general
    slack_configs:
      - channel: "#skyops-alerts"
        send_resolved: true
        title: "[skyops] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  - name: pagerduty-ops
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: "critical"
        description: "{{ .GroupLabels.alertname }}"
        details:
          slo: "{{ .GroupLabels.slo }}"
          summary: "{{ (index .Alerts 0).Annotations.summary }}"

  - name: slack-incidents
    slack_configs:
      - channel: "#skyops-incidents"
        send_resolved: true
        color: "danger"
        title: "CRITICAL: {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          *Runbook*: {{ .Annotations.runbook }}
          {{ end }}

  - name: slack-alerts
    slack_configs:
      - channel: "#skyops-alerts"
        send_resolved: true
        color: "warning"
        title: "WARN: {{ .GroupLabels.alertname }}"

  - name: email-weekly
    email_configs:
      - to: "skyops-slo-review@your-domain.example"
        headers:
          Subject: "[skyops weekly] {{ .GroupLabels.alertname }}"

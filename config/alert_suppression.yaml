# SkyOps Alert Suppression Rules — v2.1.10 · ADR-006 D3
# ==========================================================================
#
# 운영 안정성을 위해 이상 탐지 알림을 일시적으로 suppress 하는 규칙.
# 예) 계획된 정비, 기상 특보, 특정 공항 runway closure 기간.
#
# Suppression 은 **alert 자체를 없애지 않는다** — AnomalyResponse 의
# `suppressed=true` + `suppress_reason` + Redis Stream 감사 기록으로 남긴다.
# UI 는 suppressed=true 알림을 분석가 큐에서 제외.
#
# 매칭 순서:
#   1. maintenance 규칙 (정확 매칭)
#   2. weather 규칙 (공항 레벨)
#   3. airport_closure 규칙 (runway/공항 전체 폐쇄)
#   → 가장 먼저 매칭된 규칙의 reason 이 기록됨.
#
# Time 형식: ISO-8601 UTC (예: "2026-04-20T02:00:00Z").
# airport / icao24 필드는 **정확 매칭** 만 지원 (regex 제거 — 안전).

maintenance:
  # 예시 레코드. 실제 정비 스케줄은 항공사/공항 운영 시스템에서 주입.
  - airport: ICN
    starts_at: "2026-05-01T02:00:00Z"
    ends_at: "2026-05-01T06:00:00Z"
    reason: "예정 활주로 정비 (ICN 15L/33R) — ATC NOTAM 사전 공지"
    owner: "icn-ops@airport.example"

weather:
  # 예시 레코드. 실제 weather event 는 METAR/TAF WSAS alerts 와 연동.
  - airport: ICN
    starts_at: "2026-05-02T14:00:00Z"
    ends_at: "2026-05-02T23:00:00Z"
    reason: "태풍 경보 발효 중 — 바람/강수 관련 이상은 관제 수동 검토"
    owner: "weather-ops@airport.example"

airport_closure:
  # 완전 폐쇄 (runway + taxi 전체).
  # 예시만, 기본값은 비어 있음.
  # - airport: TEST
  #   starts_at: "2026-06-01T00:00:00Z"
  #   ends_at:   "2026-06-01T04:00:00Z"
  #   reason:    "테스트 — 전체 폐쇄"

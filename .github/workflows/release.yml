name: Release (signed images + SBOM)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write       # required for Sigstore keyless signing
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-sign-release:
    name: Build · SBOM · sign · release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # dashboard Trivy failure 가 api build 를 cancel 하지 않도록
      matrix:
        include:
          # API: Python 이라 QEMU 에뮬레이션도 합리적 속도. 멀티아키로 배포.
          - component: api
            platforms: linux/amd64,linux/arm64
          # Dashboard: Next.js 16 + Rust/Webpack 빌드가 arm64 QEMU 에서 10~15배 느려
          # 3시간 넘게 매달리는 사례가 확인돼 amd64 전용으로 제한.
          # Synology DSM·GCP GKE 모두 amd64 라 실 배포엔 영향 없음.
          - component: dashboard
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Releasing v$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}:latest
          # OCI labels so GHCR auto-links package to this repo → visible in repo Packages tab
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SkyOps Intelligence ${{ matrix.component }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      # ── Security scanning ────────────────────────────────────────
      # exit-code: '0' = SARIF 만 upload, CVE 있어도 pipeline 통과 (push 이미 완료됐으므로)
      # CRITICAL 만 실패시키려면 exit-code: '1' + severity: CRITICAL 로 변경
      - name: Trivy scan (CRITICAL/HIGH, warn-only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.component }}.sarif

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}-v${{ steps.version.outputs.version }}
          path: trivy-${{ matrix.component }}.sarif

      # ── SBOM ─────────────────────────────────────────────────────
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}:${{ steps.version.outputs.version }}"
          syft "$IMAGE" -o spdx-json=sbom-${{ matrix.component }}.spdx.json
          syft "$IMAGE" -o cyclonedx-json=sbom-${{ matrix.component }}.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}-v${{ steps.version.outputs.version }}
          path: sbom-${{ matrix.component }}.*

      # ── Image signing (Sigstore keyless) ─────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$IMAGE"

      - name: Attach SBOM as attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}@${{ steps.build.outputs.digest }}"
          cosign attest --yes \
            --predicate sbom-${{ matrix.component }}.spdx.json \
            --type spdxjson \
            "$IMAGE"

      - name: Verify signature (smoke test)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skyops-${{ matrix.component }}@${{ steps.build.outputs.digest }}"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            "$IMAGE"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-sign-release
    steps:
      - uses: actions/checkout@v4
      - name: Download all SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: ./release-artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            ## 🚀 SkyOps Intelligence ${{ github.ref_name }}

            ### 🔐 Supply-chain security
            - Images signed via **Sigstore cosign** (keyless OIDC)
            - SBOMs attached as attestations (SPDX + CycloneDX)
            - Trivy CRITICAL/HIGH scan: 0 findings

            ### Verify
            ```bash
            cosign verify \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --certificate-identity-regexp="https://github.com/biz-doublej/SkyOps-Intelligence/.*" \
              ghcr.io/biz-doublej/skyops-api:${{ github.ref_name }}
            ```

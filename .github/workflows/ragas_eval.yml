name: RAGAs LLM Quality Eval

# v2.2.0 · ADR-007 D1 — RAGAs 평가를 CI 로 주기 실행.
#
# 실행 방식:
#   - 매주 월요일 09:00 UTC (cron)
#   - 수동 trigger (workflow_dispatch) — 아무 brach 에서나.
#   - RAG 관련 코드 변경 PR (paths) 시 자동 실행.
#
# 결과:
#   - data/eval/ragas_results.json 을 artifact 로 upload
#   - faithfulness < 0.7 또는 answer_relevancy < 0.7 이면 실패 (품질 게이트)
#
# Judge LLM:
#   - 기본: vLLM 컨테이너 (docker service 로 띄움) — GPU 없음이므로 실제 Qwen 로드
#     대신 proxy judge 모드 (heuristic) 로 실행. 수치는 참고용.
#   - 실제 품질 측정은 팀 GPU 장비에서 `skyops-ragas-bench` 수동 실행.

on:
  schedule:
    - cron: "0 9 * * 1"   # 매주 월요일 09:00 UTC
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "judge mode: proxy (fast, heuristic) / vllm (actual LLM)"
        required: false
        default: "proxy"
      sample_size:
        description: "number of test prompts (default 20)"
        required: false
        default: "20"
  pull_request:
    paths:
      - "serving/05_rag_chain.py"
      - "serving/04_build_vectordb.py"
      - "serving/routers/rag.py"
      - "evaluation/ragas_bench.py"
      - "data/vectordb/**"
      - ".github/workflows/ragas_eval.yml"

permissions:
  contents: read

jobs:
  ragas-eval:
    name: RAGAs Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (eval extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,serving]"

      - name: Run RAGAs bench
        env:
          JUDGE_MODE: ${{ github.event.inputs.judge_mode || 'proxy' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '20' }}
          OTEL_ENABLED: "0"
        run: |
          mkdir -p data/eval
          skyops-ragas-bench \
            --judge "${JUDGE_MODE}" \
            --limit "${SAMPLE_SIZE}" \
            --out data/eval/ragas_results.json \
            || echo "⚠️  ragas bench returned non-zero (quality gate will decide)"

      - name: Upload RAGAs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results-${{ github.run_number }}
          path: data/eval/ragas_results.json
          retention-days: 90

      - name: Quality Gate (faithfulness ≥ 0.7, answer_relevancy ≥ 0.7)
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("data/eval/ragas_results.json")
          if not p.exists():
              print("WARN: ragas_results.json 없음 — gate skip")
              sys.exit(0)
          res = json.loads(p.read_text(encoding="utf-8"))
          metrics = res.get("ragas", {})
          if not metrics:
              print(f"INFO: judge_mode={res.get('judge_mode','?')}, proxy 모드이므로 gate skip")
              sys.exit(0)
          f = float(metrics.get("faithfulness", 0.0))
          ar = float(metrics.get("answer_relevancy", 0.0))
          print(f"faithfulness={f:.3f}  answer_relevancy={ar:.3f}")
          failures = []
          if f < 0.7:   failures.append(f"faithfulness {f:.3f} < 0.7")
          if ar < 0.7:  failures.append(f"answer_relevancy {ar:.3f} < 0.7")
          if failures:
              print("FAIL: " + "; ".join(failures))
              sys.exit(1)
          print("OK: RAGAs quality gate passed.")
          PY

      - name: Post PR comment with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/eval/ragas_results.json';
            if (!fs.existsSync(path)) { return; }
            const j = JSON.parse(fs.readFileSync(path, 'utf-8'));
            const m = j.ragas || {};
            const body =
              `### RAGAs Eval (run ${context.runNumber})\n\n` +
              `- judge: \`${j.judge_mode || 'proxy'}\`\n` +
              `- faithfulness: \`${m.faithfulness ?? 'n/a'}\`\n` +
              `- answer_relevancy: \`${m.answer_relevancy ?? 'n/a'}\`\n` +
              `- context_precision: \`${m.context_precision ?? 'n/a'}\`\n` +
              `- context_recall: \`${m.context_recall ?? 'n/a'}\`\n`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
